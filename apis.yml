description: Wadifa Info is a Moroccan public-sector jobs portal (concours de la fonction
  publique) based in Rabat, publishing a free, keyless, read-only JSON API of open
  civil-service recruitment competitions, indicative net salaries by grade, public
  holidays and school holidays, plus iCalendar agendas, RSS and CSV datasets under
  CC BY 4.0.
