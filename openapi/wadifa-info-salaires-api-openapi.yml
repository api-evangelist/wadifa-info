openapi: 3.2.0
info:
  title: Wadifa Info public jobs API (Morocco) Salaires API
  version: 1.0.0
  description: 'Free read-only data on Moroccan public-sector recruitment (concours) and civil-service salaries. No key. CC BY 4.0: display ''Source: Wadifa Info'' with a visible link to each item''s url field.'
  license:
    name: CC BY 4.0
    url: https://creativecommons.org/licenses/by/4.0/
  contact:
    email: contact@wadifa-info.com
    url: https://www.wadifa-info.com/developpeurs
servers:
- url: https://www.wadifa-info.com
tags:
- name: Salaires
paths:
  /api/v1/salaires:
    get:
      summary: Indicative net monthly salary by civil-service grade
      parameters:
      - name: lang
        in: query
        schema:
          type: string
          enum:
          - fr
          - ar
          default: fr
      responses:
        '200':
          description: Salaries by grade
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalaryList'
      tags:
      - Salaires
      operationId: getApiV1Salaires
      x-operation-id-source: derived
components:
  schemas:
    Salary:
      type: object
      properties:
        grade:
          type: string
        net_monthly_mad:
          type: integer
        url:
          type: string
          format: uri
    SalaryList:
      type: object
      properties:
        attribution:
          $ref: '#/components/schemas/Attribution'
        notice:
          type: string
        count:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/Salary'
    Attribution:
      type: object
      properties:
        license:
          type: string
        license_url:
          type: string
          format: uri
        required:
          type: string
        docs:
          type: string
          format: uri
