openapi: 3.2.0
info:
  title: Wadifa Info public jobs API (Morocco) Vacances Scolaires API
  version: 1.0.0
  description: 'Free read-only data on Moroccan public-sector recruitment (concours) and civil-service salaries. No key. CC BY 4.0: display ''Source: Wadifa Info'' with a visible link to each item''s url field.'
  license:
    name: CC BY 4.0
    url: https://creativecommons.org/licenses/by/4.0/
  contact:
    email: contact@wadifa-info.com
    url: https://www.wadifa-info.com/developpeurs
servers:
- url: https://www.wadifa-info.com
tags:
- name: Vacances Scolaires
paths:
  /api/v1/vacances-scolaires:
    get:
      summary: Moroccan school breaks for the 2026/2027 school year (ministerial decision…
      responses:
        '200':
          description: School breaks
          content:
            application/json:
              schema:
                type: object
                properties:
                  source:
                    type: string
                  license:
                    type: string
                  school_year:
                    type: string
                  basis:
                    type: string
                  breaks:
                    type: array
                    items:
                      type: object
                      properties:
                        start:
                          type: string
                          format: date
                        end:
                          type: string
                          format: date
                          description: inclusive
                        name_fr:
                          type: string
                        name_ar:
                          type: string
      tags:
      - Vacances Scolaires
      operationId: getApiV1VacancesScolaires
      x-operation-id-source: derived
