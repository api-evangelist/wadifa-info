tags:
- name: Jours Feries
paths:
  /api/v1/jours-feries:
    get:
      summary: Moroccan public holidays for the current and next year (civil + Islamic…
      responses:
        '200':
          description: Public holidays
          content:
            application/json:
              schema:
                type: object
                properties:
                  source:
                    type: string
                  license:
                    type: string
                  note:
                    type: string
                  holidays:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          format: date
                        name_fr:
                          type: string
                        name_ar:
                          type: string
                        religious:
                          type: boolean
                        approximate:
                          type: boolean
                          description: true for Islamic holidays until the Ministry of Habous confirms the date
      tags:
      - Jours Feries
      operationId: getApiV1JoursFeries
      x-operation-id-source: derived
