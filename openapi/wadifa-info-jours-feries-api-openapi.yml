                    type: string
                  holidays:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          format: date
                        name_fr:
                          type: string
                        name_ar:
                          type: string
                        religious:
                          type: boolean
                        approximate:
                          type: boolean
                          description: true for Islamic holidays until the Ministry of Habous confirms the date
